# ==============================================================================
# AINode - Docker Compose Configuration
# ==============================================================================
# AI services stack including:
#   - ComfyUI:      Image/video generation with ROCm GPU support
#   - Ollama:       LLM inference with ROCm GPU support
#   - Open WebUI:   Web interface for Ollama
#   - ChromaDB:     Vector database for RAG
#   - Kokoro:       Text-to-Speech API
#   - nginx:        Reverse proxy with SSL termination
#
# Prerequisites:
#   Before running docker-compose, build the base image:
#   $ docker build -t ainode-base:python313 ./docker/base
#
# Usage:
#   $ docker-compose build    # Build all service images
#   $ docker-compose up -d    # Start all services
#   $ docker-compose logs -f  # Follow logs
# ==============================================================================

name: ainode

# ==============================================================================
# Common configuration templates
# ==============================================================================

# Base configuration for all containers
x-common: &common
  logging:
    driver: none
  restart: unless-stopped

# Configuration for containers requiring GPU access (AMD ROCm)
x-common-render: &common-render
  <<: *common
  devices:
    - /dev/kfd      # ROCm kernel interface
    - /dev/dri      # Direct Rendering Infrastructure

# Common build args for user/group ID matching
x-build-args-user: &build-args-user
  USER_UID: 1000
  USER_GID: 100

# Common build args for GPU group access (Gentoo defaults)
x-build-args-gpu: &build-args-gpu
  <<: *build-args-user
  RENDER_GID: 28    # Host's render group GID
  VIDEO_GID: 27     # Host's video group GID

# ==============================================================================
# Services
# ==============================================================================

services:

  # ============================================================================
  # ChromaDB - Vector Database
  # ============================================================================
  # Stores embeddings for RAG (Retrieval-Augmented Generation).
  # Used by Open WebUI for document search and retrieval.
  # ============================================================================
  chroma:
    <<: *common
    build:
      context: .
      dockerfile: ./docker/chroma/Dockerfile
      args:
        <<: *build-args-user
        CHROMADB_VERSION: "0.6.3"
        REBUILD_HNSWLIB: "false"
    container_name: ainode-chroma
    hostname: ainode-chroma
    networks:
      - ainode-internal
    volumes:
      # Persistent vector storage
      - ./data/chroma:/home/user/app/chroma
      # Temporary storage (not persisted)
      - type: tmpfs
        target: /home/user/.cache
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777

  # ============================================================================
  # ComfyUI - Image/Video Generation
  # ============================================================================
  # AI image and video generation backend with ROCm GPU acceleration.
  # Provides the API for the ComfyChair Android application.
  # ============================================================================
  comfyui:
    <<: *common-render
    build:
      context: .
      dockerfile: ./docker/comfyui/Dockerfile
      args:
        <<: *build-args-gpu
    container_name: ainode-comfyui
    hostname: ainode-comfyui
    environment:
     - MIOPEN_FIND_MODE=2
     - PYTORCH_ALLOC_CONF=garbage_collection_threshold:0.8,max_split_size_mb:512
     - AMD_ENABLE_MIOPEN=1
     - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
    networks:
      - ainode-internal
    volumes:
      # Persistent user data and custom nodes
      - ./data/comfyui/user:/home/user/app/user
      - ./data/comfyui/custom_nodes:/home/user/app/custom_nodes
      # Shared models directory (can be used by multiple services)
      - ./data/common/models:/home/user/app/models
      # Temporary storage (not persisted)
      - type: tmpfs
        target: /home/user/.cache
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /home/user/app/input
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /home/user/app/output
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777

  # ============================================================================
  # Kokoro FastAPI - Text-to-Speech
  # ============================================================================
  # High-quality voice synthesis API using the Kokoro TTS model.
  # ============================================================================
  kokoro-fastapi:
    <<: *common-render
    build:
      context: .
      dockerfile: ./docker/kokoro-fastapi/Dockerfile
      args:
        <<: *build-args-gpu
    container_name: ainode-kokoro-fastapi
    hostname: ainode-kokoro-fastapi
    networks:
      - ainode-internal
    # tmpfs with exec permission (required for some operations)
    tmpfs:
      - /tmp:exec
    volumes:
      - type: tmpfs
        target: /home/user/.cache
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /home/user/app/output
        tmpfs:
          mode: 01777

  # ============================================================================
  # Ollama - LLM Inference
  # ============================================================================
  # Large Language Model inference server with ROCm GPU acceleration.
  # Provides the LLM backend for Open WebUI.
  # ============================================================================
  ollama:
    <<: *common-render
    build:
      context: .
      dockerfile: ./docker/ollama/Dockerfile
      args:
        <<: *build-args-gpu
    container_name: ainode-ollama
    hostname: ainode-ollama
   # environment:
    #  - OLLAMA_KEEP_ALIVE=1m
    networks:
      - ainode-internal
    # tmpfs with exec permission (required by Ollama)
    tmpfs:
      - /home/user/tmp:exec,mode=01777
    volumes:
      # Persistent model storage
      - ./data/ollama:/home/user/.ollama
      - ./data/common/models:/models
      # Temporary storage
      - type: tmpfs
        target: /home/user/.cache
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777

  # ============================================================================
  # Open WebUI - Chat Interface
  # ============================================================================
  # Web interface for interacting with Ollama and other LLM backends.
  # Includes RAG capabilities with ChromaDB integration.
  # ============================================================================
  openwebui:
    <<: *common-render
    build:
      context: .
      dockerfile: ./docker/openwebui/Dockerfile
      args:
        <<: *build-args-user
    container_name: ainode-openwebui
    hostname: ainode-openwebui
    depends_on:
      - chroma
    networks:
      - ainode-internal
    volumes:
      # Persistent data (database, uploads, etc.)
      - ./data/openwebui/data:/home/user/app/backend/data
      # Temporary storage
      - type: tmpfs
        target: /home/user/.cache
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /home/user/app/backend/data/cache
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777


  # ============================================================================
  # SearXNG - Metasearch Engine
  # ============================================================================
  # Web search backend for Open WebUI integration.
  # ============================================================================
  searxng:
    <<: *common
    image: searxng/searxng:latest
    container_name: ainode-searxng
    hostname: ainode-searxng
    networks:
      - ainode-internal
    ports:
      - "8080:8080" # Allows you to access the search engine directly in your browser
    volumes:
      - ./data/searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/

  # ============================================================================
  # Reverse Proxy (nginx)
  # ============================================================================
  # Routes external traffic to internal services.
  # Provides SSL termination and basic authentication.
  # ============================================================================
  reverseproxy:
    <<: *common
    build:
      context: .
      dockerfile: ./docker/reverseproxy/Dockerfile
    container_name: ainode-reverseproxy
    hostname: ainode-reverseproxy
    depends_on:
      - ollama
      - comfyui
      - openwebui
    networks:
      - ainode-internal
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
      - "5000:5000"   # Additional service
      - "11434:11434" # Ollama API
    volumes:
      # nginx configuration (virtual hosts)
      - ./data/reverseproxy/sites-enabled:/etc/nginx/sites-enabled
      # Basic auth password files
      - ./data/reverseproxy/htpasswd:/etc/nginx/htpasswd
      # SSL certificates
      - ./ssl:/etc/nginx/certs
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777

# ==============================================================================
# Networks
# ==============================================================================

networks:
  ainode-internal:
    driver: bridge
    name: ainode-internal
