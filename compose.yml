# ==============================================================================
# AINode - Docker Compose Configuration
# ==============================================================================
# AI services stack including:
#   - ComfyUI:      Image/video generation with ROCm GPU support
#   - Ollama:       LLM inference with ROCm GPU support
#   - Bonsai 2:     Optional ternary 27B model served by the PrismML llama.cpp
#                   fork next to Ollama (port 8080, see docker/llamacpp)
#   - Open WebUI:   Web interface for Ollama
#   - ChromaDB:     Vector database for RAG
#   - Kokoro:       Text-to-Speech API
#   - Crawl4AI:     Self-hosted web extraction API (Hermes + LAN clients)
#   - Strata:       Optional local model server (OpenAI + Anthropic API), off by
#                   default; enable with the `strata` profile
#   - nginx:        Reverse Proxy with SSL termination
#
# Configuration:
#   Every host-specific value is read from .env (see .env.example). Optional
#   services are gated by compose profiles; COMPOSE_PROFILES in .env is the
#   single switch for what this installation runs.
#
# Prerequisites:
#   Before running docker-compose, build the base image:
#   $ docker build -t ainode-base:python313 ./docker/base
#
# Usage:
#   $ docker-compose build    # Build all service images
#   $ docker-compose up -d    # Start all services
#   $ docker-compose logs -f  # Follow logs
# ==============================================================================

name: ${AINODE_PROJECT:-ainode}

# ==============================================================================
# Common configuration templates
# ==============================================================================

# Base configuration for all containers
x-common: &common
  logging:
    driver: none
  restart: unless-stopped

# Configuration for containers requiring GPU access (AMD ROCm)
x-common-render: &common-render
  <<: *common
  devices:
    - /dev/kfd      # ROCm kernel interface
    - /dev/dri      # Direct Rendering Infrastructure
  # Host group ids that own the GPU device nodes. Applied when the container
  # starts, so getting them wrong costs a restart, not a rebuild - the same ids
  # used to be baked into the images with groupmod. The build args below still
  # keep the image's own group *names* aligned; these guarantee access.
  group_add:
    - "${AINODE_RENDER_GID:-28}"
    - "${AINODE_VIDEO_GID:-27}"

# Common build args for user/group ID matching
x-build-args-user: &build-args-user
  USER_UID: ${AINODE_USER_UID:-1000}
  USER_GID: ${AINODE_USER_GID:-100}

# Common build args for GPU group access (Gentoo defaults)
x-build-args-gpu: &build-args-gpu
  <<: *build-args-user
  RENDER_GID: ${AINODE_RENDER_GID:-28}    # Host's render group GID
  VIDEO_GID: ${AINODE_VIDEO_GID:-27}     # Host's video group GID

# ==============================================================================
# Services
# ==============================================================================

services:

  # ============================================================================
  # ChromaDB - Vector Database
  # ============================================================================
  # Stores embeddings for RAG (Retrieval-Augmented Generation).
  # Used by Open WebUI for document search and retrieval.
  # ============================================================================
  chroma:
    <<: *common
    build:
      context: .
      dockerfile: ./docker/chroma/Dockerfile
      args:
        <<: *build-args-user
        CHROMADB_VERSION: "${AINODE_CHROMADB_VERSION:-0.6.3}"
        REBUILD_HNSWLIB: "${AINODE_REBUILD_HNSWLIB:-false}"
    container_name: ${AINODE_PREFIX:-ainode}-chroma
    hostname: ${AINODE_PREFIX:-ainode}-chroma
    networks:
      - ainode-internal
    volumes:
      # Persistent vector storage
      - ./data/chroma:/home/user/app/chroma
      # Temporary storage (not persisted)
      - type: tmpfs
        target: /home/user/.cache
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777

  # ============================================================================
  # ComfyUI - Image/Video Generation
  # ============================================================================
  # AI image and video generation backend with ROCm GPU acceleration.
  # Provides the API for the ComfyChair Android application.
  # ============================================================================
  comfyui:
    <<: *common-render
    profiles: ["comfyui"]
    # Built by docker/comfyui/Dockerfile; the ComfyUI version is fixed by
    # COMFYUI_REF there, not by the tag. For a version bump on an existing
    # image, build docker/comfyui/Dockerfile.update to this same tag (see
    # README).
    image: ${AINODE_PREFIX:-ainode}-comfyui:${AINODE_COMFYUI_TAG:-latest}
    build:
      context: .
      dockerfile: ./docker/comfyui/Dockerfile
      args:
        <<: *build-args-gpu
        # Both are honoured only at build time. Wiring them here is what makes
        # AINODE_COMFYUI_REF / AINODE_GPU_ARCH in .env mean anything.
        COMFYUI_REF: ${AINODE_COMFYUI_REF:-v0.44.0}
        AINODE_GPU_ARCH: ${AINODE_GPU_ARCH:-gfx1201}
    container_name: ${AINODE_PREFIX:-ainode}-comfyui
    hostname: ${AINODE_PREFIX:-ainode}-comfyui
    environment:
     - MIOPEN_FIND_MODE=2
     - PYTORCH_ALLOC_CONF=garbage_collection_threshold:0.8,max_split_size_mb:512
     - AMD_ENABLE_MIOPEN=1
     - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
     - HIP_VISIBLE_DEVICES=0
     - ROCR_VISIBLE_DEVICES=0
    networks:
      - ainode-internal
    volumes:
      # Persistent user data and custom nodes
      - ./data/comfyui/user:/home/user/app/user
      - ./data/comfyui/custom_nodes:/home/user/app/custom_nodes
      # Shared models directory (can be used by multiple services)
      - ./data/common/models:/home/user/app/models
      # Temporary storage (not persisted)
      - type: tmpfs
        target: /home/user/.cache
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /home/user/app/input
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /home/user/app/output
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777

  # ============================================================================
  # Kokoro FastAPI - Text-to-Speech
  # ============================================================================
  # High-quality voice synthesis API using the Kokoro TTS model.
  # ============================================================================
  kokoro-fastapi:
    <<: *common-render
    profiles: ["kokoro"]
    build:
      context: .
      dockerfile: ./docker/kokoro-fastapi/Dockerfile
      args:
        <<: *build-args-gpu
        # Tag or commit; keep in sync with docker/kokoro-fastapi/Dockerfile.
        AINODE_KOKORO_REF: ${AINODE_KOKORO_REF:-61797914e5f8da0baf1d0b97d9d0b15c66625615}
    container_name: ${AINODE_PREFIX:-ainode}-kokoro-fastapi
    hostname: ${AINODE_PREFIX:-ainode}-kokoro-fastapi
    networks:
      - ainode-internal
    # tmpfs with exec permission (required for some operations)
    tmpfs:
      - /tmp:exec
    volumes:
      - type: tmpfs
        target: /home/user/.cache
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /home/user/app/output
        tmpfs:
          mode: 01777

  # ============================================================================
  # Ollama - LLM Inference
  # ============================================================================
  # Large Language Model inference server with ROCm GPU acceleration.
  # Provides the LLM backend for Open WebUI.
  # ============================================================================
  ollama:
    <<: *common-render
    build:
      context: .
      dockerfile: ./docker/ollama/Dockerfile
      args:
        <<: *build-args-gpu
    container_name: ${AINODE_PREFIX:-ainode}-ollama
    hostname: ${AINODE_PREFIX:-ainode}-ollama
    networks:
      - ainode-internal
    # Optional Bonsai 2 server: the PrismML llama.cpp fork runs a second,
    # OpenAI-compatible endpoint on port 8080 next to Ollama (port 11434).
    # start.sh falls back to a plain `ollama serve` when the binaries or the
    # model files are missing, so leaving this entrypoint in place is safe.
    # See "Bonsai 2 via PrismML llama-server" in the README.
    entrypoint: ["/bin/sh", "/opt/prism/start.sh"]
    environment:
      # Bonsai 2 (PrismML llama-server on port 8080). start.sh falls back to a
      # plain `ollama serve` when the binaries or model files are missing, so
      # 1 is safe everywhere. 0 = never start the second server.
      - PRISM_ENABLE=${PRISM_ENABLE:-1}
    # tmpfs with exec permission (required by Ollama)
    tmpfs:
      - /home/user/tmp:exec,mode=01777
    volumes:
      # PrismML llama-server binaries, router preset and start script
      - ./docker/llamacpp:/opt/prism:ro
      # Persistent model storage
      - ./data/ollama:/home/user/.ollama
      - ./data/common/models:/models
      # Temporary storage
      - type: tmpfs
        target: /home/user/.cache
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777

  # ============================================================================
  # Open WebUI - Chat Interface
  # ============================================================================
  # Web interface for interacting with Ollama and other LLM backends.
  # Includes RAG capabilities with ChromaDB integration.
  # ============================================================================
  openwebui:
    <<: *common-render
    build:
      context: .
      dockerfile: ./docker/openwebui/Dockerfile
      args:
        <<: *build-args-user
        # Tag or commit; the default is the commit this stack was built against.
        # Keep in sync with the ARG default in docker/openwebui/Dockerfile.
        AINODE_OWUI_REF: ${AINODE_OWUI_REF:-f8ae8a6c328946dc62cd0712961a0632574581bf}
    container_name: ${AINODE_PREFIX:-ainode}-openwebui
    hostname: ${AINODE_PREFIX:-ainode}-openwebui
    # These used to exist only as ENV in docker/openwebui/Dockerfile, which
    # meant a 11 GB rebuild to flip a boolean. Runtime env wins over image ENV.
    environment:
      # Empty = Open WebUI keeps generating and storing its own key. Set it to
      # survive container replacement (note: changing it invalidates sessions).
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      # Set false after creating the admin account.
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-admin}
      # These were baked into the image as ainode-ollama / ainode-chroma, so a
      # custom AINODE_PREFIX silently broke both connections. Runtime env wins.
      - OLLAMA_BASE_URL=http://${AINODE_PREFIX:-ainode}-ollama:11434
      - CHROMA_HTTP_HOST=${AINODE_PREFIX:-ainode}-chroma
    depends_on:
      - chroma
    networks:
      - ainode-internal
    volumes:
      # Persistent data (database, uploads, etc.)
      - ./data/openwebui/data:/home/user/app/backend/data
      # Temporary storage
      - type: tmpfs
        target: /home/user/.cache
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /home/user/app/backend/data/cache
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777


  # ============================================================================
  # SearXNG - Metasearch Engine
  # ============================================================================
  # Web search backend for Open WebUI integration.
  # ============================================================================
  searxng:
    <<: *common
    profiles: ["searxng"]
    image: searxng/searxng:${AINODE_SEARXNG_TAG:-latest}
    container_name: ${AINODE_PREFIX:-ainode}-searxng
    hostname: ${AINODE_PREFIX:-ainode}-searxng
    networks:
      - ainode-internal
    ports:
      # Loopback only by default: the reverse proxy is the LAN entry point, and
      # Docker publishes on every interface otherwise. Set
      # AINODE_SEARXNG_BIND=0.0.0.0 in .env to expose it to the LAN directly.
      - "${AINODE_SEARXNG_BIND:-127.0.0.1}:${AINODE_SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./data/searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng.${AINODE_LAN_DOMAIN:-localdomain}/}
      # Overrides server.secret_key in data/searxng/settings.yml (SearXNG reads
      # SEARXNG_SECRET natively), so the secret lives in .env, not a config file.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}

  # ============================================================================
  # Crawl4AI - Web Extraction API
  # ============================================================================
  # Self-hosted extraction backend for Hermes and any LAN client.
  # Exposed through the reverse proxy as crawl4ai.localdomain; no host port.
  # The upstream image's own HEALTHCHECK (redis ping + GET /health) is reused.
  # ============================================================================
  crawl4ai:
    <<: *common
    profiles: ["crawl4ai"]
    image: ${AINODE_PREFIX:-ainode}-crawl4ai:${AINODE_CRAWL4AI_TAG:-latest}
    build:
      # Tiny context: the Dockerfile only pins the upstream image, so there is
      # no reason to ship the stack directory to the builder.
      context: ./docker/crawl4ai
      dockerfile: Dockerfile
    container_name: ${AINODE_PREFIX:-ainode}-crawl4ai
    hostname: ${AINODE_PREFIX:-ainode}-crawl4ai
    networks:
      - ainode-internal
    # Chromium's default 64 MB /dev/shm breaks under load.
    shm_size: "${AINODE_CRAWL4AI_SHM:-1g}"
    # The browser pool is the memory hog; cap it so a runaway crawl cannot
    # take the host down with it.
    mem_limit: ${AINODE_CRAWL4AI_MEM_LIMIT:-4g}
    environment:
      # Without a token the entrypoint binds container loopback only and the
      # reverse proxy gets connection refused. Value lives in ~/ainode/.env.
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
    volumes:
      # Runtime config (gitignored); versioned mirror in examples/crawl4ai/.
      - ./data/crawl4ai/config.yml:/app/config.yml:ro

  # ============================================================================
  # Strata - optional local model server (OpenAI and Anthropic compatible)
  # ============================================================================
  # Off by default. It is a *replacement* for the Ollama+Bonsai role rather than
  # a companion: it plans from the whole machine's RAM and takes the whole GPU.
  # Enable with strata in COMPOSE_PROFILES and STRATA_API_KEY set in .env.
  #
  # No published host port on purpose: 8080 is already taken by SearXNG, and the
  # reverse proxy injects the bearer key (same pattern as Crawl4AI).
  # Image flavors are per GPU family; rocm-gfx120x covers gfx1200/gfx1201.
  # ============================================================================
  strata:
    <<: *common-render
    image: ghcr.io/niko1221/strata:${AINODE_STRATA_TAG:-0.2.13-rocm-gfx120x}
    container_name: ${AINODE_PREFIX:-ainode}-strata
    hostname: ${AINODE_PREFIX:-ainode}-strata
    profiles: ["strata"]
    # No mem_limit on purpose: the engine plans from total system RAM and warns
    # when it sees a cap. Docker's default 10 s SIGTERM grace is too short for a
    # loading/unloading model, hence the two-minute stop window.
    shm_size: 2g
    stop_grace_period: 2m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      # Empty lets Strata generate its own key, which would then not match the
      # bearer the reverse proxy injects. Set STRATA_API_KEY before enabling.
      - API_KEY=${STRATA_API_KEY:-}
      - MODEL=${STRATA_MODEL:-IQ3_XXS}
      - CONTEXT=${STRATA_CONTEXT:-32k}
      - VISION=${STRATA_VISION:-off}
      - TUNE=${STRATA_TUNE:-skip}
      # Reuse GGUFs already on disk; otherwise the first start downloads tens of GB.
      - MODEL_PATH=${STRATA_MODEL_PATH:-/models/strata}
    networks:
      - ainode-internal
    volumes:
      - ./data/strata:/data
      - ./data/common/models:/models:ro

  # ============================================================================
  # Reverse Proxy (nginx)
  # ============================================================================
  # Routes external traffic to internal services.
  # Provides SSL termination and basic authentication.
  # ============================================================================
  reverseproxy:
    <<: *common
    build:
      context: .
      dockerfile: ./docker/reverseproxy/Dockerfile
    container_name: ${AINODE_PREFIX:-ainode}-reverseproxy
    hostname: ${AINODE_PREFIX:-ainode}-reverseproxy
    depends_on:
      ollama:    { condition: service_started }
      openwebui: { condition: service_started }
      # comfyui is optional from here on: with its profile disabled compose
      # would abort with "depends on undefined service" if this were required.
      comfyui:   { condition: service_started, required: false }
    networks:
      - ainode-internal
    ports:
      - "${AINODE_HTTP_PORT:-80}:80"       # HTTP
      - "${AINODE_HTTPS_PORT:-443}:443"     # HTTPS
      - "${AINODE_ALT_PORT:-5000}:5000"   # Additional service
      - "${AINODE_OLLAMA_PORT:-11434}:11434" # Ollama API
    volumes:
      # nginx configuration (virtual hosts)
      - ./data/reverseproxy/sites-enabled:/etc/nginx/sites-enabled
      # Basic auth password files
      - ./data/reverseproxy/htpasswd:/etc/nginx/htpasswd
      # SSL certificates
      - ./ssl:/etc/nginx/certs
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777

# ==============================================================================
# Networks
# ==============================================================================

networks:
  ainode-internal:
    driver: bridge
    name: ${AINODE_NETWORK:-ainode-internal}
