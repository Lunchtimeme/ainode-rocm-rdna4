# Example SearXNG configuration for AINode.
# Copy to data/searxng/settings.yml and set your own secret_key.
# Keep use_default_settings enabled to inherit SearXNG defaults.

use_default_settings: true

server:
  # Generate a unique secret, e.g. with: openssl rand -hex 32
  secret_key: "REPLACE_WITH_YOUR_OWN_RANDOM_SECRET"

search:
  # JSON is required for Open WebUI's SearXNG integration.
  formats:
    - html
    - json
