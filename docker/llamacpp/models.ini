# ==============================================================================
# Bonsai 2 27B - llama-server router preset
# ==============================================================================
# Served by the PrismML llama.cpp fork (build b10831 or newer) next to Ollama,
# started by start.sh on port 8080 inside the stack.
#
# The model is NOT loaded at startup: it loads on the first request and is
# released from VRAM again after `sleep-idle-seconds` of inactivity, so it can
# share the GPU with Ollama and ComfyUI.
#
# Model files live in /models/bonsai inside the container, which is
# data/common/models/bonsai in the repository (bind-mounted as /models).
# Get them from https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf:
#
#   ternary pack : Ternary-Bonsai-2-27B-PQ2_0.gguf            (~7.2 GB)
#   vision       : Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf      (~0.6 GB, optional)
#
# Point `model` (and `mmproj` when you use image input) at whichever pack you
# downloaded. The file names below are the ones this stack was tested with; a
# fine-tune works the same way. The section name in brackets becomes the model
# id that Open WebUI sees.
# ==============================================================================

version = 1

[*]
n-gpu-layers = 99
# Hybrid qwen35: 64 layers, only every 4th is full attention (16 layers),
# 4 KV heads x 256 dim = 64 KiB/token at f16. q8_0 KV halves that to
# 32 KiB/token, so 131072 tokens costs ~4 GiB VRAM (native max is 262144).
ctx-size = 131072
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = true
jinja = true
sleep-idle-seconds = 120

# PrismML recommended thinking-mode sampling for Bonsai 2 27B
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.05

[bonsai2-27b-heretic]
model = /models/bonsai/Ternary-Bonsai-2-27B-Uncensored-Heretic-PQ2_0.gguf
mmproj = /models/bonsai/mmproj-Q8_0.gguf
