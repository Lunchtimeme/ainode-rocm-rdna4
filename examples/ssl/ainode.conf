[ req ]
default_bits			= 2048
distinguished_name		= req_distinguished_name
req_extensions			= req_ext
prompt					= no

[ req_distinguished_name ]
countryName				= XX
stateOrProvinceName		= Some State
organizationName		= Some Organization
organizationalUnitName	= Some Unit
emailAddress			= root@localhost
commonName				= ainode.localdomain

# Every hostname the reverse proxy answers to must be listed here, or browsers
# and API clients reject the certificate for that name. The list below matches
# examples/reverseproxy/. If you disabled a profile you may drop its names: an
# extra SAN is harmless, a missing one is not.
[ req_ext ]
subjectAltName			= @alt_names

[ alt_names ]
DNS.1					= ainode.localdomain
IP.1					= 127.0.0.1
DNS.2					= ainode.local
DNS.3					= ainode
DNS.4					= openwebui.localdomain
DNS.5					= openwebui
DNS.6					= ollama.localdomain
DNS.7					= ollama
DNS.8					= comfyui.localdomain
DNS.9					= comfyui
DNS.10					= kokoro-fastapi.localdomain
DNS.11					= kokoro-fastapi
DNS.12					= bonsai.localdomain
DNS.13					= bonsai
DNS.14					= searxng.localdomain
DNS.15					= searxng
DNS.16					= crawl4ai.localdomain
DNS.17					= crawl4ai
DNS.18					= strata.localdomain
DNS.19					= strata
