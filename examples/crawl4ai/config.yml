# ==============================================================================
# Crawl4AI server configuration for AINode
# ==============================================================================
# Runtime copy: data/crawl4ai/config.yml (gitignored).
# Versioned mirror: examples/crawl4ai/config.yml (secrets replaced by
# placeholders). Keep the two in sync; the runtime copy is mounted read-only at
# /app/config.yml.
#
# Based on deploy/docker/config.yml from unclecode/crawl4ai 0.9.5.
# Restart after editing: docker compose restart crawl4ai
#
# Deliberately NOT enabled:
#   - deep crawling (CRAWL4AI_ALLOW_DEEP_CRAWL=true): this instance exists to
#     extract single pages for Hermes and LAN clients, not to crawl sites.
#     Leaving it off keeps the page/depth budgets in `limits` inert and denies
#     `deep_crawl_strategy` in untrusted request bodies.
#   - hooks (CRAWL4AI_HOOKS_ENABLED): declarative hooks are not needed for /md.
#   - JWT issuance: the static bearer token from .env is the only credential.
# ==============================================================================

app:
  title: "Crawl4AI API"
  version: "1.0.0"
  # The entrypoint decides the real bind: loopback unless CRAWL4AI_API_TOKEN is
  # set, in which case it binds all interfaces inside the container. The token
  # is mandatory here; without it the reverse proxy gets connection refused.
  host: "0.0.0.0"
  port: 11235
  reload: False
  workers: 1
  timeout_keep_alive: 300

# Default LLM configuration. /md with filter=fit needs no LLM.
llm:
  provider: "openai/gpt-4o-mini"
  # api_key: "REPLACE_WITH_LLM_API_KEY_IF_YOU_ENABLE_LLM_FILTERS"

# Redis is in-container, loopback-only and password-protected by the
# entrypoint's ephemeral REDIS_PASSWORD.
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: ""
  task_ttl_seconds: 3600
  ssl: False
  ssl_cert_reqs: None
  ssl_ca_certs: None
  ssl_certfile: None
  ssl_keyfile: None

# Resource governance. The page/depth budgets only apply when deep crawling is
# enabled; wall_clock_s bounds every crawl including /md.
limits:
  max_body_bytes: 10485760   # 10 MiB request body cap
  max_pages: 100             # deep-crawl budget (inert while deep crawl is off)
  max_depth: 5               # deep-crawl depth (inert while deep crawl is off)
  wall_clock_s: 300          # per-crawl deadline, 504 on timeout
  queue:
    maxsize: 1000
    workers: 4
    per_principal: 0

rate_limiting:
  enabled: True
  default_limit: "1000/minute"
  # nginx is the only client the server sees; per-IP limits are enforced there
  # if ever needed. Leave trusted_proxies empty rather than trusting arbitrary
  # X-Forwarded-For headers.
  trusted_proxies: []
  storage_uri: "memory://"

security:
  enabled: true
  jwt_enabled: false
  # The runtime credential is CRAWL4AI_API_TOKEN in ~/ainode/.env; this key is
  # only for the optional POST /token JWT flow, which stays disabled.
  api_token: ""
  https_redirect: false
  trusted_hosts: ["*"]
  # Same-origin through the reverse proxy; no cross-origin browser client.
  cors_allow_origins: []
  headers:
    x_content_type_options: "nosniff"
    x_frame_options: "DENY"
    content_security_policy: "default-src 'self'"
    strict_transport_security: "max-age=63072000; includeSubDomains"

crawler:
  base_config:
    simulate_user: true
  # Safety valve for the browser pool; the container's 4 GB mem_limit is the
  # hard stop.
  memory_threshold_percent: 95.0
  rate_limiter:
    enabled: true
    base_delay: [1.0, 2.0]
  timeouts:
    stream_init: 30.0
    batch_process: 300.0
  pool:
    # Upstream default is 40 concurrent pages. This box serves one Hermes agent
    # plus a few LAN clients with a 4 GB cap, so allow 8.
    max_pages: 8
    idle_ttl_sec: 300
    max_pages_before_recycle: 200
  browser:
    kwargs:
      headless: true
      text_mode: true
      # Crawl4AI defaults to a 1080x600 viewport and a Chrome/116 UA. Use a
      # desktop viewport and a current UA: neutral on the Samsung pages tested,
      # but it avoids compact/mobile layouts and stale-UA gates elsewhere.
      viewport_width: 1920
      viewport_height: 1080
      user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
    extra_args:
      # The image runs as a non-root user without a usable sandbox. Required
      # for Chromium to start here; see 0.9.5 security notes.
      - "--no-sandbox"
      - "--disable-dev-shm-usage"
      - "--disable-gpu"
      - "--disable-software-rasterizer"

logging:
  # AINode convention: Docker's logging driver is "none" (x-common), so this
  # level only controls how much work the process does before the line is
  # discarded. Keep it at ERROR.
  level: "ERROR"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

observability:
  prometheus:
    enabled: True
    endpoint: "/metrics"
  health_check:
    endpoint: "/health"

webhooks:
  enabled: true
  default_url: null
  data_in_payload: false
  retry:
    max_attempts: 5
    initial_delay_ms: 1000
    max_delay_ms: 32000
    timeout_ms: 30000
  headers:
    User-Agent: "Crawl4AI-Webhook/1.0"
